name: host

# The host only rebuilds when the host changes. A remote shipping new code
# does not trigger this workflow — the host picks the change up at runtime
# on the next page load, which is the entire point of federation.
on:
  push:
    branches: [main]
    paths:
      - "host/**"
      - ".github/workflows/host.yml"
  pull_request:
    paths:
      - "host/**"
      - ".github/workflows/host.yml"
  workflow_dispatch:

# All three apps publish to the same gh-pages branch, so their deploys must
# not overlap. cancel-in-progress stays false — every deploy has to land.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: host

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: host/package-lock.json

      - run: npm ci

      - run: npm run lint

      - name: Build
        env:
          # Where this app is served from — also read back at runtime as
          # import.meta.env.BASE_URL for the router's basename.
          VITE_BASE_PATH: /microfrontends-react-vite/host/
          # Resolved into remoteEntry URLs at build time. Changing either of
          # these is a host deploy; changing what they *point at* is not.
          VITE_PRODUCTS_URL: /microfrontends-react-vite/products
          VITE_CART_URL: /microfrontends-react-vite/cart
        run: npm run build

      - name: SPA fallback for deep links
        # /host/catalog is a client route with no file behind it. Pages serves
        # 404.html for unmatched paths, so make that the app itself.
        run: cp dist/index.html dist/404.html

      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./host/dist
          destination_dir: host
          # Leaves products/ and cart/ untouched.
          keep_files: true

      - name: Build root landing redirect
        if: github.event_name != 'pull_request'
        working-directory: .
        # The remotes live at sibling paths and have no page of their own worth
        # visiting, so the site root just forwards to the shell.
        run: |
          mkdir -p root-redirect
          cat > root-redirect/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>microfrontends-react-vite</title>
          <meta http-equiv="refresh" content="0; url=./host/">
          <p><a href="./host/">Continue to the host shell</a></p>
          HTML

      - name: Deploy root landing redirect
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./root-redirect
          keep_files: true
